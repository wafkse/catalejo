[package]
name = "catalejo-fault"
version = "0.1.0"
edition = "2024"
description = "Fault-tolerant memory access primitives for Catalejo."
repository = "https://github.com/wafkse/catalejo"
license = "GPL-3.0-or-later"

[lib]

[features]
stealth-mode = ["catalejo-sys/stealth-mode"]

[dependencies]
catalejo-memory = { path = "../catalejo-memory", version = "0.1.0" }
catalejo-sys = { path = "../catalejo-sys", version = "0.1.0", default-features = false }
tokel = "0.2.5"

[dev-dependencies]
libc = "0.2.186"
