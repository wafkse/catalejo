[workspace]
resolver = "3"
members = [
  "catalejo",
  "catalejo-fault",
  "catalejo-macro",
  "catalejo-memory",
  "catalejo-sys"
]

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/wafkse/catalejo"
license = "GPL-3.0-or-later"

[workspace.dependencies]
bitflags = "2"
bindgen = "0.72.1"
catalejo-fault = { path = "catalejo-fault", version = "0.2.0", default-features = false }
catalejo-macro = { path = "catalejo-macro", version = "0.2.0" }
catalejo-memory = { path = "catalejo-memory", version = "0.2.0" }
catalejo-sys = { path = "catalejo-sys", version = "0.2.0", default-features = false }
cc = "1.2.65"
criterion = { version = "0.8.2", features = ["html_reports"] }
dashmap = "6.2.1"
fack = "0.4.0"
libc = "0.2.186"
lru = "0.18.4"
nix = "0.31.3"
num-traits = { version = "0.2.19", default-features = false }
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = "3.0.6"
tokel = "0.4.0"
walkdir = "2.5.0"
