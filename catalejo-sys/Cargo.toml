[package]
name = "catalejo-sys"
version = "0.1.0"
edition = "2024"
description = "System-level userspace bindings to the Mirilla kernel module."
repository = "https://github.com/wafkse/catalejo"
license = "GPL-3.0-or-later"
build = "build.rs"

[features]
default = ["default-device-path"]
default-device-path = []
stealth-mode = []

[dependencies]
catalejo-memory = { path = "../catalejo-memory", version = "0.1.0" }
fack = "0.2.0"
libc = "0.2.186"
tokel = "0.2.5"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.65"
walkdir = "2.5.0"
