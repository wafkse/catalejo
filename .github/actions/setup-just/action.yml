name: Setup just
description: Install a pinned `just` release onto the runner PATH.

inputs:
    version:
        description: The `just` release to install.
        required: false
        default: "1.42.4"

runs:
    using: composite
    steps:
        - name: Install just
          shell: bash
          run: |
              mkdir -p "$HOME/.local/bin"
              curl -fsSL \
                "https://github.com/casey/just/releases/download/${{ inputs.version }}/just-${{ inputs.version }}-x86_64-unknown-linux-musl.tar.gz" \
                | tar xz -C "$HOME/.local/bin" just
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
