name: CI

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# The kernel matrix the mirilla-powered jobs run against: the latest longterm and
# the latest stable series. Bump the tags as kernel.org moves; the cache key
# follows the tag. Kept here as YAML so every VM job shares one definition.
env:
    VNG_VERSION: "1.41"

jobs:
    lint-rust:
        name: Automated Linting (Rust)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            - name: Install bindgen dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang llvm-dev libclang-dev

            - uses: ./.github/actions/setup-just

            - run: just lint-rust

    lint-c:
        name: Automated Linting (C)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Install C tooling
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-format clangd bear build-essential

            - uses: ./.github/actions/setup-just

            - run: just lint-c

    mirilla-test-suite:
        name: Mirilla-powered Kernel Test Suite (${{ matrix.kernel.series }})
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                kernel:
                    - { series: "6.18", tag: "v6.18.38" }
                    - { series: "7.1", tag: "v7.1.4" }
        steps:
            - uses: actions/checkout@v7

            - name: Provision mirilla kernel
              uses: ./.github/actions/mirilla-kernel
              with:
                  tag: ${{ matrix.kernel.tag }}
                  vng-version: ${{ env.VNG_VERSION }}

            - uses: ./.github/actions/setup-just

            - name: Build the module and run the C test suite in the VM
              run: just mirilla-test-vm
              env:
                  KDIR: ${{ github.workspace }}/linux

    catalejo-integration-tests:
        name: Mirilla-powered Kernel Integration Tests (${{ matrix.kernel.series }})
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                kernel:
                    - { series: "6.18", tag: "v6.18.38" }
                    - { series: "7.1", tag: "v7.1.3" }
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Install bindgen dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang llvm-dev libclang-dev

            - name: Provision mirilla kernel
              uses: ./.github/actions/mirilla-kernel
              with:
                  tag: ${{ matrix.kernel.tag }}
                  vng-version: ${{ env.VNG_VERSION }}

            - uses: ./.github/actions/setup-just

            - name: Build the module and run the Rust test suite in the VM
              run: just catalejo-test-vm
              env:
                  KDIR: ${{ github.workspace }}/linux
