[package]
name = "catalejo"
version.workspace = true
edition.workspace = true
description = "Userspace library for observing process memory through the Mirilla kernel module."
repository.workspace = true
license.workspace = true

[features]
default = ["default-device-path", "write"]
default-device-path = ["catalejo-sys/default-device-path"]
stealth-mode = ["catalejo-fault/stealth-mode", "catalejo-sys/stealth-mode"]
write = []

[dependencies]
bitflags.workspace = true
catalejo-fault.workspace = true
catalejo-macro.workspace = true
catalejo-memory.workspace = true
catalejo-sys.workspace = true
dashmap.workspace = true
fack.workspace = true
libc.workspace = true
lru.workspace = true
nix = { workspace = true, features = ["mman"] }
num-traits.workspace = true

[dev-dependencies]
# `html_reports` adds the plot and report generation on top of the default
# `plotters` backend, so a benchmark run writes SVGs under target/criterion.
criterion.workspace = true

# The peephole benchmarks drive criterion directly rather than through the built-in `libtest`
# harness, so it is disabled and each benchmark owns `main`. The self-peephole suite hands `main` to
# `criterion_main!`, whereas the foreign-peephole suite writes its own `main` so it can also serve as
# the target process the parent peepholes into.
[[bench]]
name = "self_peephole"
harness = false

[[bench]]
name = "foreign_peephole"
harness = false
