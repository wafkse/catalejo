[package]
name = "catalejo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
catalejo-fault = { path = "../catalejo-fault", version = "0.1.0" }
catalejo-macro = { version = "0.1.0", path = "../catalejo-macro" }
catalejo-memory = { path = "../catalejo-memory", version = "0.1.0" }
catalejo-sys = { path = "../catalejo-sys", version = "0.1.0" }
dashmap = "6.2.1"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["mman"] }
tracing = "0.1.44"

[dev-dependencies]
# `html_reports` adds the plot and report generation on top of the default
# `plotters` backend, so a benchmark run writes SVGs under target/criterion.
criterion = { version = "0.8.2", features = ["html_reports"] }

# The self-peephole benchmarks drive criterion directly through `criterion_main!`, so the built-in
# `libtest` harness is disabled and criterion owns `main`.
[[bench]]
name = "self_peephole"
harness = false
